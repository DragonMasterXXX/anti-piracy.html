<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anti-Piracy Warning</title>
  <style>
    /* IMPORT SILKSCREEN */
    @import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap');

    /* FIRE FLICKER ANIMATION FROM MAIN PAGE */
    @keyframes flickerFire {
      0%, 100% { filter: drop-shadow(0 0 4px #ff4500) drop-shadow(0 0 6px #ff8c00); opacity:1; }
      50% { filter: drop-shadow(0 0 8px #ff6347) drop-shadow(0 0 10px #ffa500); opacity:0.85; }
    }

    body {
      background: linear-gradient(180deg, #0b0a0f 0%, #1a120b 80%);
      color: #fff;
      font-family: 'Silkscreen', monospace;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 1rem;
      user-select: none;
      box-sizing: border-box;
    }

    h1 {
      font-family: 'Silkscreen', monospace;
      font-size: 3rem;
      margin-bottom: 1rem;
      text-transform: uppercase;
      color: #ff0000;
      text-shadow:
        0 0 3px #ff6f00,
        0 0 6px #ff3e00,
        0 0 12px #ff1a00;
      animation: flickerFire 3s infinite alternate;
    }

    p {
      font-family: 'Silkscreen', monospace;
      font-size: 1.25rem;
      max-width: 600px;
      line-height: 1.4;
      color: #f0d8b4cc;
      text-shadow: 0 0 5px rgba(255, 76, 76, 0.3);
    }

    a.button {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.75rem 1.5rem;
      background-color: #ff4500;
      color: #fff1e0;
      font-family: 'Silkscreen', monospace;
      font-weight: bold;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 30px;
      box-shadow: 0 0 8px #ff4500, 0 0 15px #ff4500;
      transition: background-color 0.3s ease, box-shadow 0.3s ease, color 0.3s ease;
      user-select: none;
    }

    a.button:hover,
    a.button:focus {
      background-color: #ff6a00;
      box-shadow: 0 0 12px #ff6a00, 0 0 25px #ff8700;
      color: #fff;
      outline: none;
    }

    .highlight {
      color: #ffcc00;
      font-weight: bold;
      text-shadow: 0 0 8px #ffaa00, 0 0 15px #ff5500;
    }
  </style>
</head>
<body>
  <h1>Access Denied</h1>
  <p>
    How <span class="highlight">bananas</span> are you?
    This site is protected against piracy and unauthorized use.
    Please respect the creator's work and use the website as intended.
  </p>
  <a href="/dragonvr-realm" class="button" tabindex="0">Return to his Realm</a>
</body>
</html>
